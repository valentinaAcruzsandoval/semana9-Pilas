<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Pila</title>

    <!-- Bootstrap: estilos prediseñados -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Gestor de Pila
            </span>
        </div>
    </nav>

    <main class="container py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">

                <div class="text-center mb-4">
                    <h1 class="h2">Estructura de datos: Pila</h1>
                    <p class="text-secondary">
                        Agrega, consulta y elimina elementos fácilmente.
                    </p>
                </div>

                <!-- Mensajes -->
                {% if message %}
                <div
                    class="alert alert-{{ message_type }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar"
                    ></button>
                </div>
                {% endif %}

                <!-- Configurar capacidad -->
                <section class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="h5">1. Configurar la pila</h2>

                        <form method="POST" class="row g-2 align-items-end">
                            <input
                                type="hidden"
                                name="action"
                                value="configurar"
                            >

                            <div class="col-12 col-md-8">
                                <label for="capacity" class="form-label">
                                    Capacidad máxima
                                </label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="capacity"
                                    name="capacity"
                                    min="1"
                                    step="1"
                                    value="{{ capacity }}"
                                    required
                                >
                            </div>

                            <div class="col-12 col-md-4">
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >
                                    Guardar capacidad
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- Agregar elementos -->
                <section class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="h5">2. Apilar un elemento</h2>

                        <form method="POST" id="pushForm">
                            <input
                                type="hidden"
                                name="action"
                                value="push"
                            >

                            <label for="item" class="form-label">
                                Valor del elemento
